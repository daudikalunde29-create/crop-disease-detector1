<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supported Crops — Crop Disease Detector</title>
    <meta name="description" content="Crops currently used as frontend examples: maize, tomato, beans, rice and potato.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/components.css" rel="stylesheet">
    <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg site-navbar sticky-top">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="../index.html">
            <span class="brand-badge"><i class="bi bi-tree-fill" aria-hidden="true"></i></span>
            <span class="brand-text" data-i18n="brand">Crop Disease Detector</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
                aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-lg-auto mb-3 mb-lg-0">
                <li class="nav-item"><a class="nav-link" href="../index.html" data-i18n="home">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="about.html" data-i18n="about">About</a></li>
                <li class="nav-item"><a class="nav-link" href="how-it-works.html" data-i18n="howItWorks">How It Works</a></li>
                <li class="nav-item"><a class="nav-link active" href="supported-crops.html" data-i18n="supportedCrops">Supported Crops</a></li>
            </ul>
            <div class="d-flex flex-wrap align-items-center gap-2">
                <div class="btn-group lang-toggle me-lg-2" role="group" aria-label="Language">
                    <button type="button" class="btn btn-outline-green" data-lang="en">English</button>
                    <button type="button" class="btn btn-outline-green" data-lang="sw">Kiswahili</button>
                </div>
                <a class="btn btn-outline-green" href="login.html" data-i18n="login">Login</a>
                <a class="btn btn-green" href="register.html" data-i18n="register">Register</a>
            </div>
        </div>
    </div>
</nav>

<main class="section-padding">
    <div class="container">
        <h1 data-i18n="supportedCrops">Supported Crops</h1>
        <p class="text-muted-soft">These crops are frontend examples only.</p>

        <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4 mt-1" id="crop-list"></div>

        <p class="note-box mt-4 mb-0">
            The final supported crops and disease classes will depend on the trained TensorFlow model and dataset.
        </p>
    </div>
</main>

<footer class="site-footer">
    <div class="container"><span>&copy; 2026 Crop Disease Detector</span></div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/language.js"></script>
<script src="../js/app.js"></script>
<script>
    // FUTURE DJANGO API: fetch('/api/crops/')
    document.addEventListener("DOMContentLoaded", function () {
        loadJSON("../data/mock-crops.json").then(function (crops) {
            var html = "";
            for (var i = 0; i < crops.length; i++) {
                html +=
                    '<div class="col"><div class="card-soft h-100"><div class="card-body">' +
                    '<span class="crop-circle mb-3"><i class="bi bi-flower2" aria-hidden="true"></i></span>' +
                    '<h2 class="h5">' + crops[i].name + "</h2>" +
                    '<p class="small text-muted-soft mb-1"><em>' + crops[i].scientificName + "</em></p>" +
                    '<p class="small text-muted-soft mb-0">Common conditions: ' + crops[i].commonDiseases + "</p>" +
                    "</div></div></div>";
            }
            document.getElementById("crop-list").innerHTML = html;
        });
    });
</script>
</body>
</html>
