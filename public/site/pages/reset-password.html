<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password — Crop Disease Detector</title>
    <meta name="description" content="Set a new password for your farmer account.">
    <meta name="referrer" content="no-referrer">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/components.css" rel="stylesheet">
    <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>

<main class="auth-wrapper">
    <div class="auth-card">
        <a class="d-flex align-items-center gap-2 text-decoration-none mb-4" href="../index.html">
            <span class="brand-badge"><i class="bi bi-tree-fill" aria-hidden="true"></i></span>
            <span class="fw-bold" style="color: var(--dark-green);" data-i18n="brand">Crop Disease Detector</span>
        </a>

        <h1 class="h3" data-i18n="resetPassword">Reset Password</h1>
        <p class="text-muted-soft">Choose a new password for your account.</p>
        <p id="token-hint" class="small text-muted-soft d-none">Open the reset link from your email, or paste the reset code from that email below.</p>

        <div id="reset-error" class="alert alert-danger d-none" role="alert"></div>
        <div id="reset-success" class="alert alert-success d-none" role="status"></div>

        <!-- Django: POST /api/auth/password-reset-confirm/  { token, password } -->
        <form id="reset-form" novalidate>
            <!-- Shown only when the page was opened without ?token=... (e.g. dev console email) -->
            <div class="mb-3 d-none" id="token-group">
                <label class="form-label" for="resetToken">Reset code</label>
                <input class="form-control" type="text" id="resetToken" name="resetToken" autocomplete="off" spellcheck="false">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password" data-i18n="newPassword">New Password</label>
                <div class="input-group">
                    <input class="form-control" type="password" id="password" name="password" autocomplete="new-password" required>
                    <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show password">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="form-text">At least 8 characters, with a letter and a number.</div>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirmPassword" data-i18n="confirmPassword">Confirm Password</label>
                <div class="input-group">
                    <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" required>
                    <button class="btn btn-outline-secondary" type="button" data-toggle-password="confirmPassword" aria-label="Show password">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <button class="btn btn-green w-100 btn-lg-action" type="submit" data-i18n="resetPassword">Reset Password</button>
        </form>

        <p class="text-center text-muted-soft mt-4 mb-0 small">
            <a href="login.html" data-i18n="login">Login</a>
        </p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/language.js"></script>
<script src="../js/app.js"></script>
<script src="../js/cloud.bundle.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/session.js"></script>
<script src="../js/auth-pages.js"></script>
</body>
</html>
