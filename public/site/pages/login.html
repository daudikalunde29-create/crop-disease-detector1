<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Crop Disease Detector</title>
    <meta name="description" content="Sign in to your farmer account to scan crops and view your scan history.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/components.css" rel="stylesheet">
    <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>

<main class="auth-wrapper">
    <div class="auth-card">
        <a class="d-flex align-items-center gap-2 text-decoration-none mb-4" href="../index.html">
            <span class="brand-badge"><i class="bi bi-tree-fill" aria-hidden="true"></i></span>
            <span class="fw-bold" style="color: var(--dark-green);" data-i18n="brand">Crop Disease Detector</span>
        </a>

        <h1 class="h3" data-i18n="login">Login</h1>
        <p class="text-muted-soft">Welcome back. Sign in to continue scanning your crops.</p>

        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>

        <!-- FUTURE DJANGO API: POST /api/auth/login/ -->
        <form id="login-form" novalidate>
            <div class="mb-3">
                <label class="form-label" for="email" data-i18n="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <div class="mb-2">
                <label class="form-label" for="password" data-i18n="password">Password</label>
                <div class="input-group">
                    <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
                    <button class="btn btn-outline-secondary" type="button" data-toggle-password="password" aria-label="Show password">
                        <i class="bi bi-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="remember" name="remember">
                    <label class="form-check-label small" for="remember" data-i18n="rememberMe">Remember me</label>
                </div>
                <a class="small" href="forgot-password.html" data-i18n="forgotPassword">Forgot Password?</a>
            </div>
            <button class="btn btn-green w-100 btn-lg-action" type="submit" data-i18n="login">Login</button>
        </form>

        <div class="d-flex align-items-center gap-2 my-3">
            <hr class="flex-grow-1 my-0">
            <span class="small text-muted-soft" data-i18n="orContinueWith">or continue with</span>
            <hr class="flex-grow-1 my-0">
        </div>

        <!-- Real Google Identity Services button renders here (js/google-auth.js) -->
        <div data-google-button class="d-flex justify-content-center"></div>

        <p class="text-center text-muted-soft mt-4 mb-0 small">
            Don't have an account? <a href="register.html" data-i18n="register">Register</a>
        </p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/language.js"></script>
<script src="../js/app.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/session.js"></script>
<script src="../js/google-auth.js"></script>
<script src="../js/auth-pages.js"></script>
</body>
</html>
