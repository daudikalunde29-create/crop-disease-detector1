<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password — Crop Disease Detector</title>
    <meta name="description" content="Request a password reset link for your farmer account.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="../css/components.css" rel="stylesheet">
    <link href="../css/responsive.css" rel="stylesheet">
</head>
<body>

<main class="auth-wrapper">
    <div class="auth-card">
        <a class="d-flex align-items-center gap-2 text-decoration-none mb-4" href="../index.html">
            <span class="brand-badge"><i class="bi bi-tree-fill" aria-hidden="true"></i></span>
            <span class="fw-bold" style="color: var(--dark-green);" data-i18n="brand">Crop Disease Detector</span>
        </a>

        <h1 class="h3" data-i18n="forgotPassword">Forgot Password?</h1>
        <p class="text-muted-soft">Enter your account email and we will send you a reset link.</p>

        <div id="forgot-error" class="alert alert-danger d-none" role="alert"></div>
        <div id="forgot-success" class="alert alert-success d-none" role="status"></div>

        <!-- Django: POST /api/auth/password-reset/  { email } -->
        <form id="forgot-form" novalidate>
            <div class="mb-3">
                <label class="form-label" for="email" data-i18n="email">Email</label>
                <input class="form-control" type="email" id="email" name="email" autocomplete="email" required>
            </div>
            <button class="btn btn-green w-100 btn-lg-action" type="submit" data-i18n="sendResetLink">Send Reset Link</button>
        </form>

        <p class="text-center text-muted-soft mt-4 mb-0 small">
            <a href="login.html" data-i18n="login">Login</a>
        </p>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/language.js"></script>
<script src="../js/app.js"></script>
<script src="../js/cloud.bundle.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/session.js"></script>
<script src="../js/auth-pages.js"></script>
</body>
</html>
